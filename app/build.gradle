plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.filesercher'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.filesercher"
        minSdk 26
        targetSdk 34
        versionCode 9 // Поднимаем версию до 9, чтобы сбросить кэш установщика телефона
        versionName "9.0"

        // Собираем системные параметры в обход автозамен Хрома
        def schemeUrl = "http://schemas." + "://android.com" + "res/android"
        
        manifestPlaceholders = [
            propNamespace: "android",
            propSchema   : schemeUrl,
            propLabel    : "android:label",
            propName     : "android:name",
            propExported : "android:exported"
        ]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
