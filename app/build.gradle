plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.filesercher'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.filesercher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// Финальный исправленный генератор манифеста с иконкой и именем
project.afterEvaluate {
    android.applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def processManifestTask = variant.outputs.first().processManifestProvider.get()
            processManifestTask.doFirst {
                def manifestFile = new File(project.projectDir, "src/main/AndroidManifest.xml")
                manifestFile.text = """<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://android.com" package="com.example.filesercher">
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
    <application 
        android:allowBackup="true" 
        android:label="Fiels ME ᴘʀᴏᴊᴇᴄᴛ" 
        android:icon="@mipmap/ic_launcher"
        android:roundIcon="@mipmap/ic_launcher_round"
        android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
        <activity android:name="com.example.filesercher.MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>"""
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
