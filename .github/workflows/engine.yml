name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Принудительно генерируем чистую структуру проекта и простейший манифест
    - name: Force Build Clean Structure
      run: |
        rm -rf app settings.gradle build.gradle AndroidManifest.xml app/src/main/AndroidManifest.xml
        
        echo "include ':app'" > settings.gradle
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF
        
        mkdir -p app
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.example.filesercher'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.filesercher"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
                multiDexEnabled true
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
        }
        EOF
        
        # Создаем простейшую заглушку манифеста через безопасную эко-команду без ломающих кавычек
        mkdir -p app/src/main
        echo "<?xml version=\"1.0\" encoding=\"utf-8\"?>" > app/src/main/AndroidManifest.xml
        echo "<manifest xmlns:android=\"http://android.com\">" >> app/src/main/AndroidManifest.xml
        echo "    <application android:label=\"Searcher\">" >> app/src/main/AndroidManifest.xml
        echo "        <activity android:name=\"com.example.filesercher.MainActivity\" android:exported=\"true\">" >> app/src/main/AndroidManifest.xml
        echo "            <intent-filter>" >> app/src/main/AndroidManifest.xml
        echo "                <action android:name=\"android.intent.action.MAIN\" />" >> app/src/main/AndroidManifest.xml
        echo "                <category android:name=\"android.intent.category.LAUNCHER\" />" >> app/src/main/AndroidManifest.xml
        echo "            </intent-filter>" >> app/src/main/AndroidManifest.xml
        echo "        </activity>" >> app/src/main/AndroidManifest.xml
        echo "    </application>" >> app/src/main/AndroidManifest.xml
        echo "</manifest>" >> app/src/main/AndroidManifest.xml

    - name: Build with Console Gradle
      run: gradle clean assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
