name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'
        cache-disabled: true

    - name: Force Fix Configs
      run: |
        rm -rf app settings.gradle build.gradle app/src/main/AndroidManifest.xml AndroidManifest.xml app/src/main/java
        echo "include ':app'" > settings.gradle
        
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF
        
        mkdir -p app
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
        android {
            namespace 'com.example.filesercher'
            compileSdk 34
            defaultConfig { applicationId "com.example.filesercher"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0"; multiDexEnabled true }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        EOF
        
        mkdir -p app/src/main
        echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://android.com"><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/><application android:allowBackup="true" android:icon="@android:drawable/ic_menu_search" android:label="File Searcher" android:theme="@android:style/Theme.DeviceDefault.NoActionBar"><activity android:name="com.example.filesercher.MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml

    # Сервер сам мгновенно сгенерирует наш идеальный код с сортировкой файлов по весу от большего к меньшему!
    - name: Generate Sorted App Code Directly
      run: |
        mkdir -p app/src/main/java/com/example/filesercher
        cat << 'EOF' > app/src/main/java/com/example/filesercher/MainActivity.kt
        package com.example.filesercher
        import android.app.Activity
        import android.content.Intent
        import android.graphics.Color
        import android.graphics.Typeface
        import android.graphics.drawable.GradientDrawable
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.os.Environment
        import android.provider.DocumentsContract
        import android.provider.Settings
        import android.view.Gravity
        import android.view.View
        import android.widget.Button
        import android.widget.CheckBox
        import android.widget.EditText
        import android.widget.LinearLayout
        import android.widget.ProgressBar
        import android.widget.ScrollView
        import android.widget.TextView
        import android.widget.Toast
        import java.io.File
        import java.util.Locale
        import kotlin.concurrent.thread
        class MainActivity : Activity() {
            private lateinit var etSearchInput: EditText
            private lateinit var btnScan: Button
            private lateinit var llResultsContainer: LinearLayout
            private lateinit var tvStatus: TextView
            private lateinit var progressBar: ProgressBar
            private lateinit var cbSearchStorage: CheckBox
            private lateinit var cbSearchCache: CheckBox
            private val defaultTargetNames = listOf("libil2cpp.so", "Yandere.zip", "R4x", "Viento", "Spoof_lios")
            private var checkedDirsCount = 0
            private val foundFilesList = mutableListOf<FileResult>()
            data class FileResult(val file: File, val matchName: String, val isCache: Boolean)
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val mainLayout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(Color.parseColor("#121214")); setPadding(32, 32, 32, 32) }
                val tvTitle = TextView(this).apply { text = "ME PROJECT : SEARCHER"; textSize = 20f; setTextColor(Color.parseColor("#FFD700")); typeface = Typeface.create(Typeface.DEFAULT, Typeface.BOLD); gravity = Gravity.CENTER; setPadding(0, 10, 0, 20) }
                mainLayout.addView(tvTitle)
                etSearchInput = EditText(this).apply { hint = "Введите имя файла для поиска..."; setHintTextColor(Color.parseColor("#666666")); setTextColor(Color.WHITE); textSize = 16f }
                mainLayout.addView(etSearchInput)
                val tagsLayout = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, 10, 0, 10) }
                val tags = listOf(".zip", ".so", ".apk", "Telegram")
                for (tag in tags) {
                    val btnTag = Button(this).apply { text = tag; textSize = 12f; val params = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f).apply { setMargins(4, 0, 4, 0) }; layoutParams = params; setOnClickListener { etSearchInput.setText(tag); etSearchInput.setSelection(tag.length) } }
                    tagsLayout.addView(btnTag)
                }
                mainLayout.addView(tagsLayout)
                cbSearchStorage = CheckBox(this).apply { text = "Искать в общей памяти"; setTextColor(Color.WHITE); isChecked = true }
                mainLayout.addView(cbSearchStorage)
                cbSearchCache = CheckBox(this).apply { text = "Искать в кэше (Android/data)"; setTextColor(Color.WHITE); isChecked = true }
                mainLayout.addView(cbSearchCache)
                btnScan = Button(this).apply { text = "ГЛУБОКИЙ ПОИСК" }
                mainLayout.addView(btnScan)
                progressBar = ProgressBar(this).apply { visibility = View.GONE }
                mainLayout.addView(progressBar)
                tvStatus = TextView(this).apply { text = "Приложение готово к работе"; textSize = 14f; setTextColor(Color.parseColor("#8E8E93")); setPadding(0, 16, 0, 16) }
                mainLayout.addView(tvStatus)
                val scrollView = ScrollView(this)
                llResultsContainer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                scrollView.addView(llResultsContainer)
                mainLayout.addView(scrollView)
                setContentView(mainLayout)
                btnScan.setOnClickListener {
                    if (!cbSearchStorage.isChecked && !cbSearchCache.isChecked) { Toast.makeText(this, "Выберите область поиска!", Toast.LENGTH_SHORT).show() } else { if (hasAllFilesPermission()) { runSearch() } else { requestAllFilesPermission() } }
                }
            }
            private fun hasAllFilesPermission(): Boolean = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) Environment.isExternalStorageManager() else true
            private fun requestAllFilesPermission() { if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) { val intent = Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION); startActivity(intent) } }
            private fun runSearch() {
                llResultsContainer.removeAllViews(); foundFilesList.clear(); checkedDirsCount = 0
                val query = etSearchInput.text.toString().trim()
                val currentTargets = if (query.isEmpty()) defaultTargetNames else listOf(query)
                btnScan.isEnabled = false; progressBar.visibility = View.VISIBLE
                thread {
                    val rootDir = Environment.getExternalStorageDirectory()
                    if (cbSearchStorage.isChecked) { collectFiles(rootDir, currentTargets, false) }
                    if (cbSearchCache.isChecked) { val androidDataDir = File(rootDir, "Android/data"); if (androidDataDir.exists() && androidDataDir.isDirectory) { collectFiles(androidDataDir, currentTargets, true) } }
                    foundFilesList.sortByDescending { it.file.length() }
                    runOnUiThread {
                        for (item in foundFilesList) { displayFileItem(item.file, item.matchName, item.isCache) }
                        btnScan.isEnabled = true; progressBar.visibility = View.GONE
                        tvStatus.text = "Успешно! Найдено совпадений: ${foundFilesList.size}\nПроверено директорий: $checkedDirsCount"
                        Toast.makeText(this@MainActivity, "Поиск завершён!", Toast.LENGTH_SHORT).show()
                    }
                }
            }
            private fun collectFiles(dir: File, targets: List<String>, scanCacheOnly: Boolean) {
                val files = dir.listFiles() ?: return
                checkedDirsCount++
                if (checkedDirsCount % 100 == 0) { runOnUiThread { tvStatus.text = "⚡ Идёт сканирование папок... [$checkedDirsCount]" } }
                for (file in files) {
                    val matchByName = targets.firstOrNull { target -> file.name.contains(target, ignoreCase = true) }
                    if (matchByName != null) { foundFilesList.add(FileResult(file, matchByName, scanCacheOnly || dir.absolutePath.contains("Android/data"))) }
                    
