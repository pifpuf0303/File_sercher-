name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'
        cache-disabled: true

    # Безопасная расшифровка манифеста из зашифрованной строки в обход ограничений терминала Linux
    - name: Auto Decode Clean Manifest
      run: |
        rm -rf app/src/main/AndroidManifest.xml AndroidManifest.xml
        mkdir -p app/src/main
        echo "" | base64 -d | tr -d '\r' > app/src/main/AndroidManifest.xml

    - name: Build Application APK
      run: gradle clean assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
