name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Сервер сам скачает готовый, идеальный проект без участия буфера обмена телефона!
    - name: Auto Clone Clean Project Structure
      run: |
        rm -rf app settings.gradle build.gradle AndroidManifest.xml
        git clone https://github.com .temp_build
        mv .temp_build/* . && rm -rf .temp_build

    - name: Build Application APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
